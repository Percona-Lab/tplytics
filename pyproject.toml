[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tplytics"
version = "0.1.0"
description = "Analytical query benchmark on the HammerDB TPROC-C schema, alone or next to a running HammerDB workload"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = ["PyMySQL>=1.0", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.1"]

[project.scripts]
tplytics = "tplytics.cli:main"

[tool.setuptools]
packages = ["tplytics"]

[tool.setuptools.package-data]
tplytics = ["queries/*.toml"]
