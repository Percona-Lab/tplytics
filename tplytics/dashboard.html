<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tplytics live</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
  --accent: #2f6fde; --ok: #1f9d55; --err: #d64545; --tmo: #d98a00; --run: #2f6fde;
  --sel: #eef3fd; --code: #f3f5f8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12151b; --panel: #1a1e26; --text: #e6e8ec; --muted: #8b93a3; --line: #2a303b;
          --accent: #6b9bff; --ok: #3ccf7f; --err: #ff6b6b; --tmo: #ffb547; --run: #6b9bff;
          --sel: #1f2a3d; --code: #141820; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
         padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0; font-weight: 650; }
header .meta { color: var(--muted); font-size: 12.5px; flex: 1 1 380px; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
         padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.status-pill { font-size: 12px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; padding: 16px 20px; }
@media (max-width: 980px) { main { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table { border-collapse: collapse; width: 100%; }
#list th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
           color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
#list td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
#list tr.q { cursor: pointer; }
#list tr.q:hover { background: var(--sel); }
#list tr.q.selected { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
#list tr.q.unsupported { opacity: .5; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.qid { font-weight: 650; }
.name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
@media (max-width: 640px) {
  .name, .opt { display: none; }
  header, main { padding-left: 16px; padding-right: 16px; }
}
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dot.ok { background: var(--ok); } .dot.error { background: var(--err); } .dot.timeout { background: var(--tmo); }
.dot.running { background: var(--run); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.cx { font-size: 11px; color: var(--muted); }
#detail { padding: 16px 18px; min-height: 300px; }
#detail h2 { margin: 0 0 4px; font-size: 18px; }
#detail .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
#detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
      overflow-x: auto; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 0; }
.kv { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
.kv b { font-variant-numeric: tabular-nums; }
.result { overflow-x: auto; }
.result table { font-size: 12.5px; }
.result th, .result td { padding: 5px 9px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.result th { color: var(--muted); font-weight: 600; }
.err { color: var(--err); }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>tplytics live</h1>
  <div class="meta" id="meta">connecting...</div>
  <span class="status-pill" id="pill">-</span>
  <button id="toggle" class="primary">Pause</button>
</header>
<main>
  <div class="card">
    <table id="list">
      <thead><tr><th></th><th>Query</th><th class="name"></th><th class="num">Last time</th><th class="num">Rows</th>
        <th class="num opt">Avg</th><th class="num opt">Runs</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="card" id="detail"><div class="empty">Click a query to see its description, SQL and results.</div></div>
</main>
<script>
let state = null, selected = null, rendered = {};

function fmtT(s) {
  if (s === null || s === undefined) return "-";
  if (s < 1) return (s * 1000).toFixed(1) + " ms";
  if (s < 100) return s.toFixed(2) + " s";
  return s.toFixed(0) + " s";
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderList() {
  const tb = document.querySelector("#list tbody");
  const html = state.queries.map(q => {
    const running = state.current && state.current.id === q.id;
    const st = running ? "running" : (q.last ? q.last.status : "");
    let t = q.last ? fmtT(q.last.elapsed) : "-";
    if (running) t = fmtT(state.now - state.current.started) + "…";
    const rows = q.last ? (q.last.status === "ok" ? q.last.rows : q.last.status) : "-";
    const cls = ["q", q.id === selected ? "selected" : "", q.supported ? "" : "unsupported"].join(" ");
    return `<tr class="${cls}" data-id="${q.id}">
      <td><span class="dot ${st}"></span></td>
      <td class="qid">${q.id}</td>
      <td class="name" title="${esc(q.name)}">${esc(q.name)} <span class="cx">cx${q.complexity}</span></td>
      <td class="num">${q.supported ? t : "n/a"}</td>
      <td class="num ${q.last && q.last.status !== "ok" ? "err" : ""}">${q.supported ? rows : "unsupported"}</td>
      <td class="num opt">${fmtT(q.avg)}</td>
      <td class="num opt">${q.runs}${q.errors + q.timeouts ? ` <span class="err">(${q.errors + q.timeouts}✕)</span>` : ""}</td></tr>`;
  }).join("");
  tb.innerHTML = html;
  tb.querySelectorAll("tr.q").forEach(tr => tr.onclick = () => { selected = tr.dataset.id; rendered = {}; renderList(); renderDetail(); });
}

function renderDetail() {
  const el = document.getElementById("detail");
  const q = state.queries.find(x => x.id === selected);
  if (!q) return;
  const running = state.current && state.current.id === q.id;
  // only re-render when something changed, so text selection in the panel is not lost
  const key = q.id + ":" + q.runs + ":" + running;
  if (rendered.key === key) return;
  rendered.key = key;
  const L = q.last;
  let html = `<h2>${q.id} · ${esc(q.name)}</h2>
    <div class="sub">complexity ${q.complexity} · tables: ${esc(q.tables.join(", "))} ·
      weight serial ${q.weight.serial} / concurrent ${q.weight.concurrent}</div>
    <div>${esc(q.description).replace(/\n/g, " ")}</div>`;
  if (!q.supported) {
    el.innerHTML = html + `<h3>Status</h3><div class="err">Not supported by ${esc(state.engine)}.</div>`;
    return;
  }
  html += `<h3>Statistics</h3><div class="kv">
      <span>runs <b>${q.runs}</b></span><span>ok <b>${q.ok}</b></span>
      <span>errors <b>${q.errors}</b></span><span>timeouts <b>${q.timeouts}</b></span>
      <span>min <b>${fmtT(q.min)}</b></span><span>avg <b>${fmtT(q.avg)}</b></span><span>max <b>${fmtT(q.max)}</b></span></div>`;
  if (running) html += `<h3>Running now</h3><pre>${esc(state.current.sql)}</pre>`;
  if (L) {
    html += `<h3>Last execution · ${new Date(L.finished * 1000).toLocaleTimeString()}</h3>
      <div class="kv"><span>status <b class="${L.status === "ok" ? "" : "err"}">${L.status}</b></span>
      <span>time <b>${fmtT(L.elapsed)}</b></span><span>rows <b>${L.rows}</b></span></div>
      <h3>Parameters</h3><div style="font-size:13px">${esc(L.params || "none")}</div>`;
    if (L.error) html += `<h3>Error</h3><pre class="err">${esc(L.error)}</pre>`;
    if (L.columns.length) {
      html += `<h3>First ${L.data.length} of ${L.rows} rows</h3><div class="result"><table><tr>${L.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>` +
        L.data.map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("") + `</table></div>`;
    }
    if (!running) html += `<h3>SQL</h3><pre>${esc(L.sql)}</pre>`;
  } else if (!running) {
    html += `<h3>Status</h3><div class="sub">Not run yet in this session.</div>`;
  }
  el.innerHTML = html;
}

async function poll() {
  try {
    const r = await fetch("api/state");
    state = await r.json();
    document.getElementById("meta").textContent =
      `${state.target} · ${state.server_version} · ${state.database} · cycle ${state.cycle} · timeout ${state.timeout}s`;
    const pausing = !state.running && state.current;
    document.getElementById("pill").textContent = state.running ? "running" : (pausing ? "pausing after current query" : "paused");
    const b = document.getElementById("toggle");
    b.textContent = state.running ? "Pause" : "Resume";
    b.className = state.running ? "" : "primary";
    if (!selected && state.queries.length) selected = state.queries[0].id;
    renderList();
    renderDetail();
  } catch (e) {
    document.getElementById("pill").textContent = "disconnected";
  }
  setTimeout(poll, 1000);
}
document.getElementById("toggle").onclick = async () => {
  await fetch(state && state.running ? "api/pause" : "api/resume", {method: "POST"});
  rendered = {};
};
poll();
</script>
</body>
</html>
