<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tplytics live</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7; --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e;
  --muted: #7a7974; --line: #e4e3df; --grid: #eeede9; --sel: #eef3fb; --code: #f3f3f0;
  --series-1: #2a78d6; --series-2: #eb6834;
  --good: #1a8a4a; --warning: #b77900; --critical: #d03b3b; --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #121211; --surface-1: #1a1a19; --text-primary: #ffffff; --text-secondary: #c3c2b7;
    --muted: #8d8c85; --line: #2c2c2a; --grid: #252523; --sel: #1d2634; --code: #151514;
    --series-1: #3987e5; --series-2: #d95926;
    --good: #3cb371; --warning: #e0a030; --critical: #ef6a6a; --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface-1: #1a1a19; --text-primary: #ffffff; --text-secondary: #c3c2b7;
  --muted: #8d8c85; --line: #2c2c2a; --grid: #252523; --sel: #1d2634; --code: #151514;
  --series-1: #3987e5; --series-2: #d95926;
  --good: #3cb371; --warning: #e0a030; --critical: #ef6a6a; --accent: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text-primary);
       font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px 28px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 0 10px; }
header h1 { font-size: 18px; margin: 0; font-weight: 700; }
header .meta { color: var(--text-secondary); font-size: 12.5px; flex: 1 1 420px; }
button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--surface-1);
         color: var(--text-primary); padding: 7px 16px; border-radius: 7px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--text-secondary); }
.card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 12px; }
h2.section { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary);
             margin: 16px 0 6px; font-weight: 650; }

/* ---- stat tiles ---- */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 860px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) {
  .wrap { padding: 0 16px 24px; } .tiles { gap: 8px; }
  .tile { padding: 10px 10px 8px; } .tile .value { font-size: 22px; } .tile .sub, .legend { display: none; }
}
.tile { padding: 9px 12px 7px; position: relative; min-width: 0; }
.tile .label { font-size: 12px; color: var(--text-secondary); display: flex; justify-content: space-between; gap: 6px;
               white-space: nowrap; overflow: hidden; }
.tile .value { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap; }
.tile .value small { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-left: 3px; }
.tile .sub { font-size: 11.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend { display: inline-flex; gap: 10px; font-size: 11.5px; color: var(--text-secondary); }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.spark { display: block; width: 100%; height: 36px; margin-top: 4px; overflow: visible; cursor: crosshair; }
.spark .grid { stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
.spark path.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.spark path.area { opacity: .12; stroke: none; }
.spark .cross { stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
.tip { position: absolute; pointer-events: none; background: var(--text-primary); color: var(--surface-1);
       font-size: 12px; padding: 5px 8px; border-radius: 6px; white-space: nowrap; display: none; z-index: 5;
       font-variant-numeric: tabular-nums; }

/* ---- current query ---- */
#current { padding: 14px 20px; min-height: 220px; }
.cur-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.cur-head .qid { font-size: 26px; font-weight: 750; }
.cur-head .qname { font-size: 22px; font-weight: 600; }
.cur-head .chips { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.state { display: inline-flex; align-items: center; gap: 7px; font-weight: 650; font-size: 13px; padding: 4px 11px;
         border-radius: 99px; border: 1px solid var(--line); }
.state .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.state.running .dot { animation: pulse 1s infinite; }
.state.waiting .dot { background: var(--muted); }
@keyframes pulse { 50% { opacity: .2; } }
.cur-desc { color: var(--text-secondary); margin: 6px 0 0; max-width: 1000px; }
.cur-grid { display: grid; grid-template-columns: minmax(200px, 260px) minmax(0, 1fr); gap: 20px; margin-top: 12px; }
@media (max-width: 800px) { .cur-grid { grid-template-columns: minmax(0, 1fr); } }
.bigstat .k { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .05em; }
.bigstat .v { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.bigstat .v2 { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.bigstat + .bigstat { margin-top: 12px; }
.status { display: inline-flex; align-items: center; gap: 5px; font-weight: 650; }
.status.ok { color: var(--good); } .status.error { color: var(--critical); } .status.timeout { color: var(--warning); }
.params { font-size: 12.5px; color: var(--text-secondary); margin-top: 10px; word-break: break-word; }
pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0;
      overflow-x: auto; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text-primary); }
pre.err { color: var(--critical); white-space: pre-wrap; }
.result { overflow-x: auto; }
.result table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.result th, .result td { padding: 5px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.result th { color: var(--text-secondary); font-weight: 600; }
.result td.n { text-align: right; font-variant-numeric: tabular-nums; }
details summary { cursor: pointer; color: var(--text-secondary); font-size: 12.5px; margin: 12px 0 6px; }
.subhead { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 6px; }

/* ---- recent queries ---- */
#history { overflow: hidden; }
.hrow { border-bottom: 1px solid var(--line); }
.hrow:last-child { border-bottom: 0; }
.hmain { display: grid; grid-template-columns: 52px 74px 58px minmax(0, 1fr) 100px 96px 70px 90px;
         gap: 10px; align-items: center; padding: 9px 16px; cursor: pointer; }
.hmain:hover, .hrow.open .hmain { background: var(--sel); }
.hhead { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary);
         cursor: default; border-bottom: 1px solid var(--line); }
.hhead:hover { background: none; }
.c-seq, .c-time { color: var(--text-secondary); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.c-id { font-weight: 700; }
.c-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-num { text-align: right; font-variant-numeric: tabular-nums; }
.c-avg { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
@media (max-width: 760px) {
  .hmain { grid-template-columns: 50px minmax(0, 1fr) 80px 56px; }
  .c-seq, .c-time, .c-avg, .c-stat { display: none; }
}
.hdetail { padding: 4px 16px 16px; display: none; }
.hrow.open .hdetail { display: block; }
.hrow.fresh { animation: slidein .6s ease-out; }
@keyframes slidein { from { background: var(--sel); transform: translateY(-8px); opacity: 0; } to { opacity: 1; } }
.empty { color: var(--muted); padding: 22px 16px; }
#rounds table { width: 100%; border-collapse: collapse; }
#rounds th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary);
             font-weight: 600; text-align: right; padding: 9px 16px; border-bottom: 1px solid var(--line); }
#rounds td { padding: 8px 16px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
#rounds tr:last-child td { border-bottom: 0; }
#rounds th:first-child, #rounds td:first-child, #rounds th.l, #rounds td.l { text-align: left; }
#rounds td.gm { font-weight: 700; }
#rounds tr.prog td { color: var(--text-secondary); font-style: italic; }
.rbar { height: 8px; border-radius: 0 4px 4px 0; background: var(--series-1); min-width: 2px; }
.delta-up { color: var(--critical); } .delta-down { color: var(--good); }
@media (max-width: 760px) { #rounds .opt { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>tplytics live</h1>
    <div class="meta" id="meta">connecting...</div>
    <span class="pill" id="pill">-</span>
    <button id="toggle" class="primary">Pause</button>
  </header>

  <div class="tiles" id="tiles"></div>

  <h2 class="section">Current query</h2>
  <div class="card" id="current"><div class="empty">Waiting for the first query...</div></div>

  <h2 class="section" id="histTitle">Recent queries</h2>
  <div class="card" id="history">
    <div class="hmain hhead"><span class="c-seq">#</span><span class="c-time">Finished</span><span class="c-id">Query</span>
      <span class="c-name"></span><span class="c-stat">Status</span><span class="c-num">Time</span><span class="c-num">Rows</span>
      <span class="c-avg">Query avg</span></div>
    <div id="hlist"><div class="empty">Finished queries appear here, newest first.</div></div>
  </div>

  <h2 class="section" id="roundsTitle">Rounds</h2>
  <div class="card" id="rounds"><div class="empty">A round is one run of every query. Completed rounds appear here, newest first.</div></div>
</div>

<script>
let S = null, curKey = null, openSeqs = new Set(), shownSeqs = [];

const ICON = { ok: "✓", error: "✕", timeout: "⏱" };
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtT(s) {
  if (s === null || s === undefined) return "–";
  if (s < 1) return (s * 1000).toFixed(s < 0.01 ? 1 : 0) + " ms";
  if (s < 100) return s.toFixed(2) + " s";
  return s.toFixed(0) + " s";
}
function fmtN(v, d) { return v === null || v === undefined ? "–" : Number(v).toLocaleString(undefined, {maximumFractionDigits: d, minimumFractionDigits: d}); }
function clock(t) { return new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false}); }
function statusHtml(st) { return `<span class="status ${st}">${ICON[st] || "•"} ${st}</span>`; }
function isNum(v) { return /^-?\d+(\.\d+)?$/.test(v); }

/* ---------- stat tiles with sparklines (last 3 minutes, 1 s samples) ---------- */
const TILES = [
  {key: "cpu", label: "CPU busy", unit: "%", series: [{f: "cpu_busy", name: "busy", color: "--series-1"}], max: 100, dec: 0,
   sub: p => p.cpu_iowait !== undefined ? `I/O wait ${fmtN(p.cpu_iowait, 0)}%` : "", need: "system"},
  {key: "disk", label: "Disk throughput", unit: "MB/s", series: [{f: "read_mb", name: "read", color: "--series-1"},
   {f: "write_mb", name: "write", color: "--series-2"}], dec: 1, need: "system",
   sub: p => `read ${fmtN(p.read_mb, 1)} · write ${fmtN(p.write_mb, 1)}`},
  {key: "iops", label: "Disk IOPS", unit: "", series: [{f: "iops", name: "IOPS", color: "--series-1"}], dec: 0, need: "system",
   sub: () => "reads + writes, all disks"},
  {key: "tps", label: "DB transactions/s", unit: "", series: [{f: "tps", name: "tx/s", color: "--series-1"}], dec: 0, need: "db",
   sub: () => "commits + rollbacks"},
  {key: "geo", label: "Query geomean", title: "geometric mean of the per-query average times; sparkline: geomean of each completed round", unit: "", series: [{f: "gm", name: "round geomean", color: "--series-1"}], need: "rounds",
   slots: 10, time: true},
];
// points for a tile: system samples, or one point per completed round (oldest first)
function tilePoints(t) {
  if (t.need === "rounds") return (S.rounds || []).slice().reverse().filter(r => r.geomean).map(r => ({t: r.finished, gm: r.geomean, n: r.n}));
  return (S.series || []).filter(p => p[t.series[0].f] !== undefined);
}
function fmtV(t, v) { return t.time ? fmtT(v) : fmtN(v, t.dec) + (t.unit ? " " + t.unit : ""); }
function buildTiles() {
  const el = document.getElementById("tiles");
  el.innerHTML = TILES.map(t => `<div class="card tile" id="tile-${t.key}"${t.title ? ` title="${t.title}"` : ""}>
      <div class="label"><span>${t.label}</span>${t.series.length > 1 ? `<span class="legend">${t.series.map(s =>
        `<span><i style="background:var(${s.color})"></i>${s.name}</span>`).join("")}</span>` : ""}</div>
      <div class="value">–</div><div class="sub"></div>
      <svg class="spark" viewBox="0 0 300 54" preserveAspectRatio="none"></svg>
      <div class="tip"></div></div>`).join("");
  TILES.forEach(t => {
    const tile = document.getElementById("tile-" + t.key), svg = tile.querySelector("svg"), tip = tile.querySelector(".tip");
    svg.addEventListener("mousemove", ev => {
      if (!S) return;
      const pts = tilePoints(t), slots = t.slots || 180;
      if (pts.length < 2) return;
      const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * (slots - 1) - (slots - pts.length);
      const i = Math.max(0, Math.min(pts.length - 1, Math.round(x)));
      t.hover = i;
      drawTile(t);
      const p = pts[i];
      tip.innerHTML = (p.n ? `round ${p.n} · ` : "") + `${clock(p.t)}<br>` + t.series.map(s => `${s.name}: <b>${fmtV(t, p[s.f])}</b>`).join("<br>");
      tip.style.display = "block";
      const tr = tile.getBoundingClientRect();
      let left = ev.clientX - tr.left + 12;
      if (left + tip.offsetWidth > tr.width) left = ev.clientX - tr.left - tip.offsetWidth - 12;
      tip.style.left = left + "px"; tip.style.top = (r.top - tr.top - 8) + "px";
    });
    svg.addEventListener("mouseleave", () => { t.hover = null; tip.style.display = "none"; drawTile(t); });
  });
}
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
}
function drawTile(t) {
  const tile = document.getElementById("tile-" + t.key);
  const enabled = t.need === "system" ? S.system_stats : t.need === "db" ? S.db_stats : true;
  const pts = tilePoints(t), slots = t.slots || 180;
  const val = tile.querySelector(".value"), sub = tile.querySelector(".sub"), svg = tile.querySelector("svg");
  if (!enabled) { val.innerHTML = "–"; sub.textContent = t.need === "system" ? "not available on this host" : "not available for this engine"; svg.innerHTML = ""; return; }
  if (t.need === "rounds") {
    if (S.geomean === null || S.geomean === undefined) {
      const done = S.round_progress ? S.round_progress.executed : 0;
      val.innerHTML = "–";
      sub.textContent = `after round 1 · ${done}/${S.queries_per_round} done`;
    } else {
      val.textContent = fmtT(S.geomean);
      const last = S.rounds[0];
      sub.textContent = `${S.rounds_done} round${S.rounds_done === 1 ? "" : "s"}` + (last ? ` · last ${fmtT(last.geomean)}` : "");
    }
  }
  if (!pts.length) { svg.innerHTML = ""; return; }
  const last = pts[pts.length - 1];
  if (t.need !== "rounds") {
    const head = t.series.reduce((a, s) => a + (last[s.f] || 0), 0);
    val.innerHTML = `${fmtN(head, t.dec)}${t.unit ? `<small>${t.unit}</small>` : ""}`;
    sub.textContent = t.sub(last);
  }
  const W = 300, H = 54;
  const ymax = t.max || niceMax(Math.max(...pts.flatMap(p => t.series.map(s => p[s.f] || 0))) * 1.1);
  const X = i => (i + (slots - pts.length)) / (slots - 1) * W, Y = v => H - 2 - (v / ymax) * (H - 4);
  let h = `<line class="grid" x1="0" x2="${W}" y1="${H - 1}" y2="${H - 1}"/><line class="grid" x1="0" x2="${W}" y1="${Y(ymax / 2)}" y2="${Y(ymax / 2)}"/>`;
  t.series.forEach((s, k) => {
    const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p[s.f] || 0).toFixed(1)}`).join("");
    if (k === 0 && t.series.length === 1) h += `<path class="area" style="fill:var(${s.color})" d="${line}L${X(pts.length - 1)},${H}L${X(0)},${H}Z"/>`;
    h += `<path class="line" style="stroke:var(${s.color})" d="${line}"/>`;
    if (t.need === "rounds") pts.forEach((p, i) => { h += `<circle cx="${X(i)}" cy="${Y(p[s.f])}" r="2.5" style="fill:var(${s.color})" vector-effect="non-scaling-stroke"/>`; });
  });
  if (t.hover !== null && t.hover !== undefined && t.hover < pts.length) h += `<line class="cross" x1="${X(t.hover)}" x2="${X(t.hover)}" y1="0" y2="${H}"/>`;
  svg.innerHTML = h;
}

/* ---------- current query ---------- */
function resultTable(e) {
  if (!e.columns || !e.columns.length) return "";
  return `<div class="result"><table><tr>${e.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${
    e.data.map(r => `<tr>${r.map(v => `<td class="${isNum(v) ? "n" : ""}">${esc(v)}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
function detailBody(e, openSql) {
  let h = "";
  if (e.state !== "running") {
    if (e.error) h += `<p class="subhead">Error</p><pre class="err">${esc(e.error)}</pre>`;
    else if (e.columns && e.columns.length && e.rows) h += `<p class="subhead">First ${e.data.length} of ${e.rows} rows</p>${resultTable(e)}`;
    else h += `<p class="subhead">No rows returned</p>`;
  }
  h += `<details ${openSql ? "open" : ""}><summary>SQL</summary><pre>${esc(e.sql)}</pre></details>`;
  return h;
}
function renderCurrent() {
  const el = document.getElementById("current"), e = S.current;
  if (!e) return;
  const key = e.seq + ":" + e.state;
  if (key !== curKey) {
    curKey = key;
    const running = e.state === "running";
    el.innerHTML = `<div class="cur-head"><span class="qid">${e.id}</span><span class="qname">${esc(e.name)}</span>
        <span class="chips"><span class="pill">#${e.seq} · complexity ${e.complexity}</span>
        <span class="state ${e.state}"><span class="dot"></span><span id="stateText"></span></span></span></div>
      <p class="cur-desc">${esc(e.description).replace(/\n/g, " ")}</p>
      <div class="cur-grid">
        <div>
          <div class="bigstat"><div class="k">${running ? "Running for" : "Response time"}</div><div class="v" id="curTime">${running ? "" : fmtT(e.elapsed)}</div></div>
          <div class="bigstat"><div class="k">Rows returned</div><div class="v2">${running ? "…" : fmtN(e.rows, 0)}</div></div>
          ${running ? "" : `<div class="bigstat"><div class="k">Status</div><div class="v2">${statusHtml(e.status)}</div></div>`}
          <div class="params"><b>Tables:</b> ${esc(e.tables.join(", "))}<br><b>Parameters:</b> ${esc(e.params || "none")}</div>
        </div>
        <div>${detailBody(e, running)}</div>
      </div>`;
  }
  const st = document.getElementById("stateText");
  if (e.state === "running") {
    document.getElementById("curTime").textContent = fmtT(Math.max(0, S.now - e.started));
    st.textContent = "running";
  } else if (!S.running) {
    st.textContent = "waiting · paused";
  } else {
    const left = S.next_start ? Math.max(0, Math.ceil(S.next_start - S.now)) : 0;
    st.textContent = left ? `waiting · next query in ${left}s` : "waiting";
  }
}

/* ---------- recent queries: newest on top, oldest drops off the bottom ---------- */
function rowHtml(e) {
  return `<div class="hmain"><span class="c-seq">#${e.seq}</span><span class="c-time">${clock(e.finished)}</span>
      <span class="c-id">${e.id}</span><span class="c-name">${esc(e.name)}</span><span class="c-stat">${statusHtml(e.status)}</span>
      <span class="c-num">${e.status === "ok" ? fmtT(e.elapsed) : `<span class="status ${e.status}">${fmtT(e.elapsed)}</span>`}</span>
      <span class="c-num">${e.status === "ok" ? fmtN(e.rows, 0) : "–"}</span><span class="c-avg">${fmtT(e.avg)}</span></div>
    <div class="hdetail"><p class="cur-desc" style="margin:4px 0 10px">${esc(e.description).replace(/\n/g, " ")}</p>
      <div class="params" style="margin:0 0 10px"><b>Parameters:</b> ${esc(e.params || "none")}</div>${detailBody(e, false)}</div>`;
}
function renderHistory() {
  const list = document.getElementById("hlist"), hist = S.history || [];
  document.getElementById("histTitle").textContent = hist.length ? `Recent queries (last ${hist.length})` : "Recent queries";
  const seqs = hist.map(h => h.seq);
  if (!hist.length || seqs.join() === shownSeqs.join()) return;
  const known = new Map([...list.querySelectorAll(".hrow")].map(r => [Number(r.dataset.seq), r]));
  const frag = document.createDocumentFragment();
  hist.forEach(e => {
    let r = known.get(e.seq);
    if (!r) {
      r = document.createElement("div");
      r.className = "hrow" + (shownSeqs.length ? " fresh" : "");
      r.dataset.seq = e.seq;
      r.innerHTML = rowHtml(e);
      r.querySelector(".hmain").onclick = () => {
        r.classList.toggle("open");
        r.classList.contains("open") ? openSeqs.add(e.seq) : openSeqs.delete(e.seq);
      };
      if (openSeqs.has(e.seq)) r.classList.add("open");
    }
    frag.appendChild(r);
  });
  list.innerHTML = "";
  list.appendChild(frag);
  shownSeqs = seqs;
}

/* ---------- rounds: geomean of every query execution in one pass over all queries ---------- */
let roundsKey = null;
function renderRounds() {
  const el = document.getElementById("rounds"), rs = S.rounds || [], pr = S.round_progress;
  const key = JSON.stringify([rs.map(r => r.n), pr && pr.executed]);
  if (key === roundsKey) return;
  roundsKey = key;
  document.getElementById("roundsTitle").textContent = rs.length ? `Rounds (last ${rs.length} of ${S.rounds_done})` : "Rounds";
  if (!rs.length && !pr) return;
  const maxG = Math.max(0.001, ...rs.map(r => r.geomean || 0));
  let h = `<table><tr><th>Round</th><th class="opt">Started</th><th class="opt">Finished</th><th class="opt">Duration</th>
      <th>OK</th><th class="opt">Errors</th><th class="opt">Timeouts</th><th>Geomean</th><th>vs previous</th><th class="l" style="width:22%"></th></tr>`;
  if (pr) h += `<tr class="prog"><td>${pr.n}</td><td class="opt" colspan="3">in progress · ${pr.executed} of ${S.queries_per_round} queries</td>
      <td></td><td class="opt"></td><td class="opt"></td><td>${pr.geomean ? fmtT(pr.geomean) + " so far" : "–"}</td><td></td><td></td></tr>`;
  rs.forEach((r, i) => {
    const prev = rs[i + 1];
    let d = "–";
    if (prev && prev.geomean && r.geomean) {
      const pct = 100 * (r.geomean / prev.geomean - 1);
      d = `<span class="${pct > 0 ? "delta-up" : "delta-down"}">${pct > 0 ? "▲" : "▼"} ${Math.abs(pct).toFixed(1)}%</span>`;
    }
    h += `<tr><td>${r.n}</td><td class="opt">${clock(r.started)}</td><td class="opt">${clock(r.finished)}</td>
      <td class="opt">${fmtT(r.finished - r.started)}</td><td>${r.ok}</td>
      <td class="opt ${r.errors ? "delta-up" : ""}">${r.errors}</td><td class="opt ${r.timeouts ? "delta-up" : ""}">${r.timeouts}</td>
      <td class="gm">${fmtT(r.geomean)}</td><td>${d}</td>
      <td class="l"><div class="rbar" style="width:${r.geomean ? Math.max(1, 100 * r.geomean / maxG) : 0}%" title="${fmtT(r.geomean)}"></div></td></tr>`;
  });
  el.innerHTML = h + "</table>";
}

async function poll() {
  try {
    const r = await fetch("api/state");
    S = await r.json();
    document.getElementById("meta").textContent =
      `${S.target} · ${S.server_version} · ${S.database} · ${S.executed} queries run · at most one query every ${S.interval}s (${S.order})` +
      (S.unsupported.length ? ` · not supported by ${S.engine}: ${S.unsupported.join(", ")}` : "");
    const pill = document.getElementById("pill"), b = document.getElementById("toggle");
    pill.textContent = S.running ? "running" : (S.current && S.current.state === "running" ? "pausing after this query" : "paused");
    b.textContent = S.running ? "Pause" : "Resume";
    b.className = S.running ? "" : "primary";
    TILES.forEach(drawTile);
    renderCurrent();
    renderHistory();
    renderRounds();
  } catch (e) {
    document.getElementById("pill").textContent = "disconnected";
  }
  setTimeout(poll, 1000);
}
document.getElementById("toggle").onclick = async () => {
  await fetch(S && S.running ? "api/pause" : "api/resume", {method: "POST"});
  curKey = null;
};
buildTiles();
poll();
</script>
