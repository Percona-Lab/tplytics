id = "Q18"
name = "District benchmarking"
complexity = 3
tables = ["orders", "order_line"]
description = """
Which districts over- or under-perform their warehouse? Computes the revenue
of every district in a time window, compares it with the average of its
warehouse, ranks it inside the warehouse and overall, and lists the largest
deviations first.
Several window functions (AVG, RANK, SUM OVER) over an aggregated join,
wrapped in a derived table to order by a computed deviation.
"""
weight = { serial = 1, concurrent = 2 }

[params]
wh = { type = "warehouse_range", fraction = [0.1, 0.5], min = 2, max = 100 }
win = { type = "time_window", fraction = [0.05, 0.3], anchor = "mixed" }
top = { type = "choice", values = [10, 20, 30] }

[sql]
default = """
WITH district_sales AS (
  SELECT o.o_w_id                                              AS w_id,
         o.o_d_id                                              AS d_id,
         SUM(CASE WHEN ol.ol_number = 1 THEN 1 ELSE 0 END)     AS orders,
         SUM(ol.ol_amount)                                     AS revenue
  FROM   orders o
  JOIN   order_line ol ON ol.ol_w_id = o.o_w_id AND ol.ol_d_id = o.o_d_id AND ol.ol_o_id = o.o_id
  WHERE  o.o_w_id BETWEEN {wh_lo} AND {wh_hi}
    AND  o.o_entry_d >= {win_start} AND o.o_entry_d < {win_end}
  GROUP  BY o.o_w_id, o.o_d_id
), compared AS (
  SELECT w_id, d_id, orders, revenue,
         ROUND(AVG(revenue) OVER (PARTITION BY w_id), 2)                         AS wh_avg_revenue,
         ROUND(100.0 * (revenue - AVG(revenue) OVER (PARTITION BY w_id))
                     / NULLIF(AVG(revenue) OVER (PARTITION BY w_id), 0), 2)      AS pct_vs_wh_avg,
         RANK() OVER (PARTITION BY w_id ORDER BY revenue DESC)                   AS rank_in_wh,
         RANK() OVER (ORDER BY revenue DESC)                                     AS rank_overall,
         ROUND(100.0 * revenue / NULLIF(SUM(revenue) OVER (), 0), 3)             AS pct_of_total
  FROM   district_sales
)
SELECT *
FROM   compared
ORDER  BY ABS(pct_vs_wh_avg) DESC, w_id, d_id
LIMIT  {top}
"""
