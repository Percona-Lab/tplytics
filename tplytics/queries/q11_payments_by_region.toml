id = "Q11"
name = "Payments by customer region"
complexity = 2
tables = ["history", "customer"]
description = """
Which regions pay the most? Joins every payment in a time window to the
paying customer and ranks customer states by amount paid, with the average
payment and the part paid by bad-credit customers.
Whole-database query: full scan of history (no date index) plus a
primary-key lookup into customer for every payment in the window.
"""
weight = { serial = 1, concurrent = 2 }

[params]
win = { type = "time_window", fraction = [0.02, 0.2], anchor = "mixed" }
top = { type = "choice", values = [10, 20, 30] }

[sql]
default = """
SELECT c.c_state                                                        AS state,
       COUNT(*)                                                         AS payments,
       SUM(h.h_amount)                                                  AS amount,
       ROUND(AVG(h.h_amount), 2)                                        AS avg_payment,
       SUM(CASE WHEN c.c_credit = 'BC' THEN h.h_amount ELSE 0 END)      AS bad_credit_amount,
       ROUND(100.0 * SUM(CASE WHEN c.c_credit = 'BC' THEN h.h_amount ELSE 0 END) / NULLIF(SUM(h.h_amount), 0), 2) AS pct_bad_credit
FROM   history h
JOIN   customer c ON c.c_w_id = h.h_c_w_id AND c.c_d_id = h.h_c_d_id AND c.c_id = h.h_c_id
WHERE  h.h_date >= {win_start} AND h.h_date < {win_end}
GROUP  BY c.c_state
ORDER  BY amount DESC, state
LIMIT  {top}
"""
