id = "Q13"
name = "Brand vs generic sales"
complexity = 2
tables = ["district", "order_line", "item", "stock"]
description = """
How much revenue comes from brand-name products? TPC-C marks an order line as
"brand" when both the item and the supplying stock record contain ORIGINAL.
For the latest orders of a slice of warehouses splits lines, units and
revenue into brand and generic and shows each one's share of the warehouse
revenue (an aggregate inside a window function).
Four-table join: district, order_line, item and stock (primary-key lookups).
"""
weight = { serial = 2, concurrent = 4 }

[params]
wh = { type = "warehouse_range", fraction = [0.02, 0.1], min = 1, max = 20 }
last = { type = "choice", values = [200, 500, 1000] }

[sql]
default = """
SELECT ol.ol_w_id                                                            AS w_id,
       CASE WHEN i.i_data LIKE '%ORIGINAL%' AND s.s_data LIKE '%ORIGINAL%'
            THEN 'brand' ELSE 'generic' END                                  AS brand_generic,
       COUNT(*)                                                              AS order_lines,
       SUM(ol.ol_quantity)                                                   AS units,
       SUM(ol.ol_amount)                                                     AS revenue,
       ROUND(AVG(i.i_price), 2)                                              AS avg_item_price,
       ROUND(100.0 * SUM(ol.ol_amount) / NULLIF(SUM(SUM(ol.ol_amount)) OVER (PARTITION BY ol.ol_w_id), 0), 2) AS pct_of_wh_revenue
FROM   district d
JOIN   order_line ol ON ol.ol_w_id = d.d_w_id AND ol.ol_d_id = d.d_id
                    AND ol.ol_o_id >= d.d_next_o_id - {last}
JOIN   item i  ON i.i_id = ol.ol_i_id
JOIN   stock s ON s.s_w_id = ol.ol_supply_w_id AND s.s_i_id = ol.ol_i_id
WHERE  d.d_w_id BETWEEN {wh_lo} AND {wh_hi}
GROUP  BY ol.ol_w_id,
          CASE WHEN i.i_data LIKE '%ORIGINAL%' AND s.s_data LIKE '%ORIGINAL%' THEN 'brand' ELSE 'generic' END
ORDER  BY 1, 2
"""
