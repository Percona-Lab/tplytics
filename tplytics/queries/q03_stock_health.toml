id = "Q03"
name = "Stock health by warehouse"
complexity = 1
tables = ["stock"]
description = """
Which warehouses are running low on stock? For a slice of warehouses counts
the SKUs, units on hand and the SKUs below a reorder threshold, and lists the
warehouses with the highest share of low stock first.
Single table: primary-key range scan of stock (100,000 rows per warehouse).
"""
weight = { serial = 3, concurrent = 8 }

[params]
wh = { type = "warehouse_range", fraction = [0.02, 0.1], min = 1, max = 20 }
threshold = { type = "int", range = [12, 25] }
top = { type = "choice", values = [5, 10, 20] }

[sql]
default = """
SELECT s_w_id                                                               AS w_id,
       COUNT(*)                                                             AS skus,
       SUM(s_quantity)                                                      AS units_on_hand,
       ROUND(AVG(s_quantity), 1)                                            AS avg_units,
       MIN(s_quantity)                                                      AS min_units,
       SUM(CASE WHEN s_quantity < {threshold} THEN 1 ELSE 0 END)            AS low_skus,
       ROUND(100.0 * SUM(CASE WHEN s_quantity < {threshold} THEN 1 ELSE 0 END) / COUNT(*), 2) AS pct_low
FROM   stock
WHERE  s_w_id BETWEEN {wh_lo} AND {wh_hi}
GROUP  BY s_w_id
ORDER  BY pct_low DESC, w_id
LIMIT  {top}
"""
