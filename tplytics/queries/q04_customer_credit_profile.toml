id = "Q04"
name = "Customer credit profile"
complexity = 1
tables = ["customer"]
description = """
How do good-credit (GC) and bad-credit (BC) customers compare? For a slice of
warehouses shows, per credit rating, the number of customers, average
discount, the spread of account balances and how many customers carry a
balance above a threshold.
Single table: primary-key range scan of customer (30,000 rows per warehouse).
"""
weight = { serial = 3, concurrent = 8 }

[params]
wh = { type = "warehouse_range", fraction = [0.02, 0.1], min = 1, max = 20 }
balance = { type = "choice", values = [0, 1000, 5000, 10000] }

[sql]
default = """
SELECT c_credit                                                     AS credit,
       COUNT(*)                                                     AS customers,
       ROUND(100 * AVG(c_discount), 2)                              AS avg_discount_pct,
       ROUND(AVG(c_balance), 2)                                     AS avg_balance,
       MIN(c_balance)                                               AS min_balance,
       MAX(c_balance)                                               AS max_balance,
       SUM(c_balance)                                               AS total_balance,
       SUM(CASE WHEN c_balance > {balance} THEN 1 ELSE 0 END)       AS balance_over_threshold,
       ROUND(100.0 * SUM(CASE WHEN c_balance > {balance} THEN 1 ELSE 0 END) / COUNT(*), 2) AS pct_over_threshold
FROM   customer
WHERE  c_w_id BETWEEN {wh_lo} AND {wh_hi}
GROUP  BY c_credit
ORDER  BY c_credit
"""
