id = "Q06"
name = "Delivery backlog"
complexity = 1
tables = ["new_order"]
description = """
Where are orders waiting to be delivered? For a slice of warehouses counts the
undelivered orders (new_order rows), how many districts have a backlog and
the oldest and newest pending order number.
Single table: primary-key range scan of new_order (small and constantly
changing: New-Order inserts, Delivery deletes).
"""
weight = { serial = 3, concurrent = 10 }

[params]
wh = { type = "warehouse_range", fraction = [0.1, 0.5], min = 1, max = 500 }
top = { type = "choice", values = [5, 10, 20] }

[sql]
default = """
SELECT no_w_id                               AS w_id,
       COUNT(*)                              AS pending_orders,
       COUNT(DISTINCT no_d_id)               AS districts_with_backlog,
       MIN(no_o_id)                          AS oldest_pending_o_id,
       MAX(no_o_id)                          AS newest_pending_o_id,
       ROUND(1.0 * COUNT(*) / COUNT(DISTINCT no_d_id), 1) AS pending_per_district
FROM   new_order
WHERE  no_w_id BETWEEN {wh_lo} AND {wh_hi}
GROUP  BY no_w_id
ORDER  BY pending_orders DESC, w_id
LIMIT  {top}
"""
