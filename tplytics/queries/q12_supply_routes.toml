id = "Q12"
name = "Cross-warehouse supply routes"
complexity = 2
tables = ["district", "order_line", "warehouse"]
description = """
Which warehouses ship stock to which? In the latest orders of a slice of
warehouses finds the order lines supplied by another warehouse and ranks the
busiest home -> supplier routes, with the supplier's name and state.
Join of district, order_line and warehouse, filtered to remote lines (~1%).
"""
weight = { serial = 2, concurrent = 4 }

[params]
wh = { type = "warehouse_range", fraction = [0.1, 0.5], min = 1, max = 100 }
last = { type = "choice", values = [500, 1000, 2000] }
top = { type = "choice", values = [10, 20] }

[sql]
default = """
SELECT ol.ol_w_id                AS home_w_id,
       ol.ol_supply_w_id         AS supply_w_id,
       sw.w_name                 AS supplier_name,
       sw.w_state                AS supplier_state,
       COUNT(*)                  AS remote_lines,
       SUM(ol.ol_quantity)       AS units,
       SUM(ol.ol_amount)         AS value
FROM   district d
JOIN   order_line ol ON ol.ol_w_id = d.d_w_id AND ol.ol_d_id = d.d_id
                    AND ol.ol_o_id >= d.d_next_o_id - {last}
JOIN   warehouse sw ON sw.w_id = ol.ol_supply_w_id
WHERE  d.d_w_id BETWEEN {wh_lo} AND {wh_hi}
  AND  ol.ol_supply_w_id <> ol.ol_w_id
GROUP  BY ol.ol_w_id, ol.ol_supply_w_id, sw.w_name, sw.w_state
ORDER  BY remote_lines DESC, value DESC, home_w_id, supply_w_id
LIMIT  {top}
"""
