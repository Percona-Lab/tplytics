id = "Q15"
name = "Top customers per district"
complexity = 3
tables = ["orders", "order_line", "customer"]
description = """
Who are the best customers of every district? Ranks customers by spend in a
time window within each district of a slice of warehouses, keeps the top K
per district and shows their name, credit rating, orders, spend and share of
the district's revenue.
Window functions (ROW_NUMBER and SUM OVER PARTITION) over an aggregated join.
"""
weight = { serial = 1, concurrent = 2 }

[params]
wh = { type = "warehouse_range", fraction = [0.02, 0.1], min = 1, max = 10 }
win = { type = "time_window", fraction = [0.1, 0.6], anchor = "mixed" }
top = { type = "choice", values = [1, 3, 5] }

[sql]
default = """
WITH spend AS (
  SELECT o.o_w_id                                              AS w_id,
         o.o_d_id                                              AS d_id,
         o.o_c_id                                              AS c_id,
         SUM(CASE WHEN ol.ol_number = 1 THEN 1 ELSE 0 END)     AS orders,
         SUM(ol.ol_amount)                                     AS amount
  FROM   orders o
  JOIN   order_line ol ON ol.ol_w_id = o.o_w_id AND ol.ol_d_id = o.o_d_id AND ol.ol_o_id = o.o_id
  WHERE  o.o_w_id BETWEEN {wh_lo} AND {wh_hi}
    AND  o.o_entry_d >= {win_start} AND o.o_entry_d < {win_end}
  GROUP  BY o.o_w_id, o.o_d_id, o.o_c_id
), ranked AS (
  SELECT s.*,
         ROW_NUMBER() OVER (PARTITION BY s.w_id, s.d_id ORDER BY s.amount DESC, s.c_id) AS rnk,
         SUM(s.amount) OVER (PARTITION BY s.w_id, s.d_id)                                AS district_amount
  FROM   spend s
)
SELECT r.w_id, r.d_id, r.rnk,
       r.c_id,
       c.c_first, c.c_last, c.c_credit,
       r.orders,
       r.amount,
       ROUND(100.0 * r.amount / NULLIF(r.district_amount, 0), 2)   AS pct_of_district
FROM   ranked r
JOIN   customer c ON c.c_w_id = r.w_id AND c.c_d_id = r.d_id AND c.c_id = r.c_id
WHERE  r.rnk <= {top}
ORDER  BY r.w_id, r.d_id, r.rnk
"""
