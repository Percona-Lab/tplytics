id = "Q10"
name = "Carrier delivery performance"
complexity = 2
tables = ["orders", "order_line"]
description = """
How fast does each carrier deliver? For orders entered in a time window in a
slice of warehouses compares the carriers by delivered orders, lines and
value and by the delay between order entry and delivery.
Two-table join with date arithmetic, which differs between engines.
"""
weight = { serial = 2, concurrent = 4 }

[params]
wh = { type = "warehouse_range", fraction = [0.05, 0.25], min = 1, max = 50 }
win = { type = "time_window", fraction = [0.05, 0.5], anchor = "mixed" }

[sql]
mysql = """
SELECT o.o_carrier_id                                                       AS carrier,
       SUM(CASE WHEN ol.ol_number = 1 THEN 1 ELSE 0 END)                    AS delivered_orders,
       COUNT(*)                                                             AS delivered_lines,
       SUM(ol.ol_amount)                                                    AS delivered_value,
       ROUND(AVG(TIMESTAMPDIFF(SECOND, o.o_entry_d, ol.ol_delivery_d)), 1)  AS avg_delay_s,
       MAX(TIMESTAMPDIFF(SECOND, o.o_entry_d, ol.ol_delivery_d))            AS max_delay_s,
       ROUND(100.0 * SUM(CASE WHEN o.o_all_local = 0 THEN 1 ELSE 0 END) / COUNT(*), 2) AS pct_lines_in_remote_orders
FROM   orders o
JOIN   order_line ol ON ol.ol_w_id = o.o_w_id AND ol.ol_d_id = o.o_d_id AND ol.ol_o_id = o.o_id
WHERE  o.o_w_id BETWEEN {wh_lo} AND {wh_hi}
  AND  o.o_entry_d >= {win_start} AND o.o_entry_d < {win_end}
  AND  o.o_carrier_id IS NOT NULL
GROUP  BY o.o_carrier_id
ORDER  BY o.o_carrier_id
"""
postgresql = """
SELECT o.o_carrier_id                                                       AS carrier,
       SUM(CASE WHEN ol.ol_number = 1 THEN 1 ELSE 0 END)                    AS delivered_orders,
       COUNT(*)                                                             AS delivered_lines,
       SUM(ol.ol_amount)                                                    AS delivered_value,
       ROUND(AVG(EXTRACT(EPOCH FROM (ol.ol_delivery_d - o.o_entry_d)))::numeric, 1) AS avg_delay_s,
       MAX(EXTRACT(EPOCH FROM (ol.ol_delivery_d - o.o_entry_d)))::bigint    AS max_delay_s,
       ROUND(100.0 * SUM(CASE WHEN o.o_all_local = 0 THEN 1 ELSE 0 END) / COUNT(*), 2) AS pct_lines_in_remote_orders
FROM   orders o
JOIN   order_line ol ON ol.ol_w_id = o.o_w_id AND ol.ol_d_id = o.o_d_id AND ol.ol_o_id = o.o_id
WHERE  o.o_w_id BETWEEN {wh_lo} AND {wh_hi}
  AND  o.o_entry_d >= {win_start} AND o.o_entry_d < {win_end}
  AND  o.o_carrier_id IS NOT NULL
GROUP  BY o.o_carrier_id
ORDER  BY o.o_carrier_id
"""
